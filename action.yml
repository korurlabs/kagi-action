name: 'Kagi Secrets'
description: >-
  Load the secret set Kagi grants this workflow, with the job's own OIDC id-token. No stored
  credential: installs the checksum-verified Kagi CLI and runs its CI mode.
author: 'Korur'

branding:
  icon: 'key'
  color: 'purple'

# Every input is optional: a job with `permissions: id-token: write` needs none of them.
inputs:
  binding-id:
    description: >-
      The id of the Kagi CI binding to evaluate. Leave it unset: Kagi finds the binding from the
      job's own claims. Needed only for a binding with a custom audience, which Kagi reaches only by
      its id. It is a reference, not a credential.
    required: false
    default: ''
  audience:
    description: >-
      Audience of the GitHub id-token. Leave it unset to use the Kagi CLI's default (api.kagi.pw).
      Set it, together with binding-id, only for a binding that pins its own expected audience.
    required: false
    default: ''
  api-url:
    description: >-
      Kagi API root. Change it only for a self-hosted Kagi deployment. Must be https.
    required: false
    default: 'https://api.kagi.pw'
  version:
    description: >-
      Kagi CLI version to install. Leave it unset to install the version this action release pins.
      Any other version is refused, because the action has no checksum for it.
    required: false
    default: ''
  pull:
    description: >-
      Run `kagi pull --github-env`, which puts the secret set into the environment of every later
      step of this job. Set it to false to only install the CLI, and run `kagi run -- <command>` in
      the step that needs the secrets, which hands them to that one command.
    required: false
    default: 'true'

runs:
  using: 'node24'
  main: 'src/main.js'
  post: 'src/post.js'
  # The default, stated: the post step revokes the job's GitHub tokens even when the job failed.
  post-if: 'always()'
