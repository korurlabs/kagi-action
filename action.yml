name: 'Kagi Secrets'
description: >-
  Load the secrets of a Kagi app environment that a Kagi workload role grants this workflow, with
  the job's own OIDC id-token. No stored credential: installs the checksum-verified Kagi CLI and
  runs it.
author: 'Korur'

branding:
  icon: 'lock'
  color: 'purple'

# No input is marked required, so the runner never rejects a step before the action can say what is
# missing. The action itself requires app-id and environment when it pulls without a binding-id.
inputs:
  app-id:
    description: >-
      The id (a UUID) of the Kagi app whose secrets this job reads. A workload role of the
      organization must grant this job that app's environment. Required with environment when the
      action pulls, unless binding-id is set.
    required: false
    default: ''
  environment:
    description: >-
      The slug of the app environment to read, such as production. Required with app-id when the
      action pulls, unless binding-id is set.
    required: false
    default: ''
  binding-id:
    description: >-
      Legacy. The id of a Kagi CI binding. Set it only for a job that still reads through a CI
      binding created before workload roles; the binding then decides what the job gets, and
      app-id and environment must be unset. New CI bindings can no longer be created.
    required: false
    default: ''
  audience:
    description: >-
      Audience of the GitHub id-token. Leave it unset to use the Kagi CLI's default, the host of
      api-url (api.kagi.pw by default). Set it only when your Kagi deployment expects another one.
    required: false
    default: ''
  api-url:
    description: >-
      Kagi API root. Change it only for a self-hosted Kagi deployment. Must be https.
    required: false
    default: 'https://api.kagi.pw'
  version:
    description: >-
      Kagi CLI version to install. Leave it unset to install the version this action release pins.
      Any other version is refused, because the action has no checksum for it.
    required: false
    default: ''
  pull:
    description: >-
      Run `kagi pull --github-env`, which puts the secrets into the environment of every later step
      of this job. Set it to false to only install the CLI, and run
      `kagi run --identity github --app-id <id> --env <slug> -- <command>` in the step that needs the
      secrets, which hands them to that one command.
    required: false
    default: 'true'

runs:
  using: 'node24'
  main: 'src/main.js'
  post: 'src/post.js'
  # The default, stated: the post step revokes the job's GitHub tokens even when the job failed.
  post-if: 'always()'
