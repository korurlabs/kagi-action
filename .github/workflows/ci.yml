name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read only. Pull requests run with this token, so it may never write, and no job requests an
# id-token: the smoke test points the CLI at a stand-in token service instead.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The action has no dependencies, so there is nothing to install and nothing to bundle: what is
  # in src/ is exactly what runs on a customer's runner. action.yml declares `using: node24`, so
  # GitHub always executes this action on the Node 24 runtime no matter what else is installed on
  # the runner. A Node 20 leg would test an environment this action can never run in, and it
  # fails, because `node --test` did not gain glob expansion until Node 22 and the test script
  # uses a `test/**/*.test.js` pattern.
  test:
    name: unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - run: npm test

  # Runs the real action on a real runner: the real download of the pinned Kagi CLI and its
  # checksum check, the real CLI in CI mode, the runner's own INPUT_* wiring, $GITHUB_ENV, $GITHUB_PATH
  # and the post step. GitHub's token service and the Kagi API are replaced by test/e2e-server.js.
  # The job deliberately does NOT request id-token: write, so the only token-service variables in
  # play are the ones the steps below point at the stand-in.
  #
  # Each leg exercises a different archive of the pinned release, which only that platform can
  # download and run: linux_amd64, linux_arm64 and darwin_arm64.
  smoke:
    name: end-to-end smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only for the stand-in server; the action itself runs on the runner's own node24.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Start the stand-in token service and Kagi API
        run: |
          node test/e2e-server.js &
          for _ in $(seq 1 50); do
            [ -f e2e-endpoints.env ] && break
            sleep 0.1
          done
          test -f e2e-endpoints.env
          cat e2e-endpoints.env >> "$GITHUB_ENV"

      - name: Install the CLI without pulling
        uses: ./
        with:
          pull: 'false'

      # kagi run fetches the set itself and hands it to its command only.
      - name: kagi run hands the set to one command
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.E2E_TOKEN_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: e2e-runner-bearer
          KAGI_API_URL: ${{ env.E2E_API_URL }}
        run: |
          set -euo pipefail
          command -v kagi
          kagi run -- sh -c 'test "$E2E_SECRET" = "$E2E_SECRET_VALUE"'
          test -z "${E2E_SECRET:-}"

      - name: Run the action
        uses: ./
        with:
          api-url: ${{ env.E2E_API_URL }}
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.E2E_TOKEN_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: e2e-runner-bearer

      - name: The secret set is in the environment of later steps
        run: |
          set -euo pipefail
          test "$E2E_SECRET" = "$E2E_SECRET_VALUE"
          test "$E2E_MULTILINE" = "$(printf 'first-line\nsecond-line')"
          # The single-use Kagi token stays in the CLI's memory and never reaches a later step.
          if env | grep -q 'e2e-kagi-token-'; then
            echo "::error::The Kagi token reached the environment of a later step."
            exit 1
          fi

      # The reserved binding id below makes the stand-in refuse the exchange with a 401, as Kagi
      # does for a job no binding accepts. The step must fail; it must never let the job continue
      # without its secrets.
      - name: A refused job fails the step
        id: denied
        continue-on-error: true
        uses: ./
        with:
          binding-id: 00000000-0000-4000-8000-000000000000
          api-url: ${{ env.E2E_API_URL }}
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.E2E_TOKEN_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: e2e-runner-bearer

      - name: ...and the failure was loud, not silent
        env:
          OUTCOME: ${{ steps.denied.outcome }}
        run: test "$OUTCOME" = "failure"

  # An action's metadata is only validated when a workflow tries to use it, which is far too late
  # for a customer. Parsing it here fails the PR instead.
  metadata:
    name: action.yml is valid
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse action.yml and check the entry points exist
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          try:
              import yaml
          except ImportError:
              sys.exit("pyyaml missing")
          spec = yaml.safe_load(pathlib.Path("action.yml").read_text())
          runs = spec["runs"]
          assert runs["using"] == "node24", runs["using"]
          for key in ("main", "post"):
              entry = pathlib.Path(runs[key])
              assert entry.is_file(), f"runs.{key}: {entry} does not exist"
          # A job with id-token: write must need no input at all.
          for name, data in spec.get("inputs", {}).items():
              assert not data.get("required", False), f"input {name} is required"
          release = json.loads(pathlib.Path("src/cli-release.json").read_text())
          assert len(release["assets"]) == 4, release
          print("action.yml OK:", runs["using"], runs["main"], runs["post"], "CLI", release["version"])
          PY
